query ListAllMovies @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  movies {
    id
    title
    genre
    releaseYear
  }
}

query GetMovieById($id: UUID!) @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  movie(key: {id: $id}) {
    id
    title
    genre
    releaseYear
    description
  }
}

mutation CreateNewMovie($title: String!, $genre: String!, $releaseYear: Int!, $description: String) @auth(level: USER, insecureReason: "This operation allows logged-in users to create movies, which is intended.") {
  movie_insert(data: {
    title: $title,
    genre: $genre,
    releaseYear: $releaseYear,
    description: $description
  })
}

mutation UpdateMovieDescription($id: UUID!, $description: String!) @auth(level: USER, insecureReason: "This operation allows logged-in users to update movie descriptions, which is intended.") {
  movie_update(key: {id: $id}, data: {
    description: $description
  })
}